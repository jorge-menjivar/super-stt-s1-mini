# SPDX-License-Identifier: GPL-3.0-only
#:schema https://jorge-menjivar.github.io/super-stt/backend.schema.json
# S1-mini by Superwhisper — a local transcript normalizer. Subprocess backend.
# See docs/protocol/backend/ in the super-stt repo.

[backend]
  id          = "app.super-stt.s1-mini"
  source      = "github.com/jorge-menjivar/super-stt-s1-mini"
  name        = "S1-mini"
  version     = "0.1.0"
  kind        = "subprocess"
  entrypoint  = "super-stt-backend-s1-mini"
  contract    = "v2"
  license     = "GPL-3.0-only"
  description = "S1-mini by Superwhisper, a small local model that cleans up dictated text. Removes fillers, resolves corrections, fixes punctuation and casing, and writes out numbers and dates. English only."

# No egress: the model runs entirely on this machine, and a subprocess backend
# has no network in any case.
[network]
  allowed_hosts = []

  # One build per (target, accelerator, CUDA runtime, compute capability).
  # candle compiles its CUDA kernels ahead of time for one compute capability,
  # so there is one asset per SM the release workflow builds for.

[[assets.subprocess]]
  file   = "s1-mini-x86_64-unknown-linux-gnu-cpu.tar.gz"
  target = "x86_64-unknown-linux-gnu"
  accel  = "cpu"

[[assets.subprocess]]
  file       = "s1-mini-x86_64-unknown-linux-gnu-cuda12-sm75.tar.gz"
  target     = "x86_64-unknown-linux-gnu"
  accel      = "cuda"
  cuda_major = 12
  cuda_sm    = 75

[[assets.subprocess]]
  file       = "s1-mini-x86_64-unknown-linux-gnu-cuda12-sm80.tar.gz"

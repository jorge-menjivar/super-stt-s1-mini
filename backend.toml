  # The three axes of the control line S1-mini is steered with. Each is a
  # closed set the model was trained on, so each declares its `choices`: the
  # settings app offers them as a dropdown, and the daemon refuses to store
  # anything else. The backend still folds case and whitespace and falls back
  # to the default for a value it does not know, which is what keeps an older
  # daemon, and anything driving the socket directly, from reaching the model
  # with a value it has never seen.
  #
  # The descriptions say what each value does. They no longer list the values
  # themselves, because the dropdown does that now.

[[options]]
  name        = "styling"
  label       = "Styling"
  description = "The register to write in. Casual is all lowercase with apostrophes stripped. Semi-casual keeps your phrasing and capitalizes I and its contractions. Semi-formal is standard written English, with contractions kept. Formal expands them."
  type        = "string"
  default     = "semi-formal"
  choices     = ["casual", "semi-casual", "semi-formal", "formal"]

[[options]]
  name        = "structure"
  label       = "Structure"
  description = "How the text is laid out. Prose writes sentences and paragraphs. Lists may turn an enumeration of three or more items into a bulleted list."
  type        = "string"
  default     = "prose"
  choices     = ["prose", "lists"]

[[options]]
  name        = "context"
  label       = "Context"
  description = "What the text is for. General writes flowing text. Email writes a greeting line, the body, and a sign-off block separated by blank lines."
  type        = "string"
  default     = "general"
  choices     = ["general", "email"]

  # A post-processor: the daemon drives this model over POST /v1/process with
  # a finished transcript, never over /v1/transcribe. Selected in the settings
  # app under Models → Post-processing.
  #
  # Release v1 of the model, in the Q4_K_M build the model card recommends and
  # measured its accuracy on. Pinned to the Hugging Face commits that
  # published it and to the bytes' SHA-256, so what the daemon downloads is
  # what was reviewed. The tokenizer is Qwen3's, shipped in the model's own
  # repo. The repo also carries an f16 conversion; it is the intermediate the
  # Q4_K_M is produced from, three times the download for no measured gain,
  # so it is deliberately not listed.

[[models]]
  name                 = "s1-mini-q4_k_m"
  role                 = "post_processor"
  multilingual         = false
  primary_language     = "en"
  supported_languages  = ["en"]
  supported_devices    = ["cpu", "gpu"]
  # 484 MB of weights plus the KV cache and activations for a 1k-token
  # prompt; comfortably under 1 GiB, and it also runs on a laptop CPU.
  estimated_vram_bytes = 1073741824

  files = [
    { url = "https://huggingface.co/superwhisper/s1-mini-GGUF/resolve/34add00a48a2e5d24e5a4ee5405a99620a3a240c/s1-mini-q4_k_m.gguf", destination = "models/s1-mini-q4_k_m/s1-mini-q4_k_m.gguf", sha256 = "3b41ebe2502cbd03e811d5d16b022f5ab551eda58d62597d152f89535003c634" },
    { url = "https://huggingface.co/superwhisper/s1-mini/resolve/88f6b15896c73bbb13a3b596e0afe8ea0d5150b4/tokenizer.json", destination = "models/s1-mini-q4_k_m/tokenizer.json", sha256 = "aeb13307a71acd8fe81861d94ad54ab689df773318809eed3cbe794b4492dae4" },
  ]

# SPDX-License-Identifier: GPL-3.0-only
# Standalone S1-mini subprocess backend. Depends only on third-party crates —
# no super-stt code. Its own workspace root, with its own Cargo.lock.

[package]
  name    = "super-stt-backend-s1-mini"
  version = "0.1.0"
  edition = "2024"
  license = "GPL-3.0-only"
  publish = false

# Own workspace root — never absorbed into a parent workspace.
[workspace]

  # cross (cross-rs): forward CUDA_COMPUTE_CAP into the build container so
  # candle's kernels compile for the requested compute capability —
  # `nvidia-smi` isn't available inside `docker build`, so without this
  # candle-kernels fails to detect the cap. The release workflow sets
  # CUDA_COMPUTE_CAP per matrix entry.
  [workspace.metadata.cross.build.env]
    passthrough = ["CUDA_COMPUTE_CAP"]

[dependencies]
  anyhow              = "1"
  axum                = {
    version          = "0.8",
    default-features = false,
    features         = ["json", "tokio"]
  }
  # The same candle revision the Voxtral backend pins: upstream plus the
  # fork's one fix, gating the `__hmax_nan`/`__hmin_nan` shim in
  # candle-kernels so the CUDA build runs on sm75 (Turing). It carries
  # `quantized_qwen3` with GGUF loading and a clearable KV cache.
  candle-core         = {
    git = "https://github.com/jorge-menjivar/candle.git",
    rev = "eef47d5df512eefcba05a4eb7f3716ea2088287b"
  }
  candle-transformers = {
    git = "https://github.com/jorge-menjivar/candle.git",
    rev = "eef47d5df512eefcba05a4eb7f3716ea2088287b"
  }
  env_logger          = "0.11"
  hyper               = { version = "1", features = ["http1", "server"] }
  hyper-util          = {
    version  = "0.1",
    features = ["http1", "server", "service", "tokio"]
  }
  log                 = "0.4"
  serde               = { version = "1", features = ["derive"] }
  serde_json          = "1"
  # Reads the Qwen3 `tokenizer.json` the manifest provisions beside the
  # weights. The same version candle-core already depends on at the pinned
  # revision, so it adds no second copy; no default features requested here,
  # since candle's own dependency already decides them.
  tokenizers          = { version = "0.22", default-features = false }
  tokio               = {
    version  = "1",
    features = ["macros", "net", "rt-multi-thread", "signal", "sync"]
  }

[dev-dependencies]
  bytes          = "1"
  http-body-util = "0.1"
  hyper          = { version = "1", features = ["client", "http1"] }
  tempfile       = "3"
  # `ServiceExt::oneshot` for in-process router/handler tests.
  tower          = { version = "0.5", features = ["util"] }

[features]
  default = []
  cuda    = ["candle-core/cuda", "candle-transformers/cuda"]
